<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlayWeb - Jeux</title>
    <link rel="icon" href="../assets/playweb-fav-w.ico" sizes="any" />
    <link rel="icon" type="image/png" href="../assets/playweb-fav-w.png" />
    <link rel="apple-touch-icon" href="../assets/playweb-fav-b.jpg" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="shop">
    <div class="background-glow">
      <div class="glow-1"></div>
      <div class="glow-2"></div>
    </div>
    <div id="app"></div>
    <div id="toast" class="toast-wrap" role="status" aria-live="polite"></div>
    <div id="game-modes" hidden>
      <span data-game-id="brainrotstar" data-game-mode="MULTI & SOLO"></span>
      <span data-game-id="gambleking" data-game-mode="MULTI & SOLO"></span>
      <span data-game-id="chess" data-game-mode="MULTI"></span>
    </div>
    <template id="page-template">
      <section class="card games-hero">
        <div class="eyebrow">Bibliothèque</div>
        <h2>Notre sélection<br />de jeux.</h2>
        <p>
          Lancez des expériences immersives et découvrez de nouvelles aventures
          en solo ou en multi !
        </p>
      </section>
      
      <a href="#" class="card discord-banner" id="discord-card" role="button" tabindex="0">
        <div class="discord-banner-title">
          <i data-lucide="message-circle"></i>
          <h2>Rejoindre le Discord</h2>
        </div>
        <p class="muted">Rejoignez la communauté pour discuter, trouver des parties et suivre les dernières actus !</p>
      </a>

      <div class="section-title">
        <h2>Jeux</h2>
        <span class="muted small" data-games-count></span>
      </div>
      <div class="grid games-grid"></div>
    </template>
    <div id="discord-modal-overlay" class="discord-modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="discord-modal-title">
      <div class="discord-modal-card">
        <button id="discord-modal-close" class="discord-modal-close" type="button" aria-label="Fermer">
          <i data-lucide="x"></i>
        </button>
        <div class="discord-modal-icon" aria-hidden="true">💬</div>
        <h2 id="discord-modal-title" class="discord-modal-title">Rejoins notre Discord</h2>
        <img class="discord-modal-qr" src="../assets/qr-code-discord.jpg" alt="QR code pour rejoindre le Discord BrainrotStar">
        <p class="discord-modal-or">ou</p>
        <a class="discord-modal-link" href="https://discord.gg/fSR33HnRaf" target="_blank" rel="noopener noreferrer">
          <i data-lucide="external-link"></i>
          <span>Ouvrir le lien Discord</span>
        </a>
      </div>
    </div>
    <script src="../script.js"></script>
    <script src="script.js"></script>
  </body>
</html>
