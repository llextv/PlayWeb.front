<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlayWeb - Mises à jour</title>
    <link rel="icon" href="../assets/playweb-fav-w.ico" sizes="any" />
    <link rel="icon" type="image/png" href="../assets/playweb-fav-w.png" />
    <link rel="apple-touch-icon" href="../assets/playweb-fav-b.jpg" />
    <script src="../auth-guard.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="updates">
    <div class="background-glow">
      <div class="glow-1"></div>
      <div class="glow-2"></div>
    </div>
    <div id="app"></div>
    <div id="toast" class="toast-wrap"></div>
    <template id="page-template">
      <div class="updates-page">
        <section class="updates-card">
          <div class="updates-card-header">
            <i data-lucide="scroll-text"></i>
            <div>
              <div class="eyebrow">Journal de développement</div>
              <h2>Mises à jour</h2>
            </div>
            <span class="version-badge">PlayWeb</span>
          </div>
          <p class="muted">
            Les nouveautés, améliorations et corrections des jeux PlayWeb.
          </p>
        </section>

        <section class="updates-card">
          <div class="updates-card-header">
            <i data-lucide="sparkles"></i>
            <h2>BrainrotStar</h2>
            <span class="version-badge">V3.5.0</span><span class="version-date">02/11/2026</span>
          </div>
          <div class="patchnote-content">
            <p class="muted">
              La plus grosse mise à jour depuis la V3 : des récompenses tous les jours, un boss à battre ensemble chaque semaine, le Gambling, les tournois, la saison 2 du Villaggio, les succès et plein de corrections.
            </p>

            <div class="patchnote-section">
              <div class="patchnote-section-header">
                <i data-lucide="flame"></i>
                <h3>Série de connexion</h3>
              </div>
              <ul class="patchnote-list">
                <li>
                  <span class="new-badge">NOUVEAU</span> Connecte-toi chaque jour pour faire monter ta série et récupérer une récompense. Nouvelle récompense tous les jours à 10h
                </li>
                <li>
                  <span class="improve-badge">AMÉLIORATION</span> Attention : si tu rates un jour, ta série repart à 1
                </li>
              </ul>
            </div>

            <div class="patchnote-section">
              <div class="patchnote-section-header">
                <i data-lucide="list-checks"></i>
                <h3>Missions du jour</h3>
              </div>
              <ul class="patchnote-list">
                <li>
                  <span class="new-badge">NOUVEAU</span> 5 missions par jour, une par mode : Multijoueur, Boutique, Villaggio, Marché et Gambling
                </li>
              </ul>
            </div>

            <div class="patchnote-section">
              <div class="patchnote-section-header">
                <i data-lucide="skull"></i>
                <h3>Boss de la semaine</h3>
              </div>
              <ul class="patchnote-list">
                <li>
                  <span class="new-badge">NOUVEAU</span> Un boss à battre tous ensemble chaque semaine juste en jouant, avec des récompenses à chaque palier
                </li>
                <li>
                  <span class="improve-badge">AMÉLIORATION</span> Le bloc série / missions / boss de l'accueil peut être réduit, et il se rouvre tout seul quand il y a du nouveau
                </li>
              </ul>
            </div>

            <div class="patchnote-section">
              <div class="patchnote-section-header">
                <i data-lucide="dices"></i>
                <h3>Gambling</h3>
              </div>
              <ul class="patchnote-list">
                <li>
                  <span class="new-badge">NOUVEAU</span> Mise tes Brainrots sur la roue pour tenter d'en décrocher un meilleur (5 tours par jour)
                </li>
              </ul>
            </div>

            <div class="patchnote-section">
              <div class="patchnote-section-header">
                <i data-lucide="trophy"></i>
                <h3>Tournois</h3>
              </div>
              <ul class="patchnote-list">
                <li>
                  <span class="new-badge">NOUVEAU</span> Des tournois organisés par l'équipe, en points ou en combat 1v1, avec des récompenses à la clé
                </li>
              </ul>
            </div>

            <div class="patchnote-section">
              <div class="patchnote-section-header">
                <i data-lucide="swords"></i>
                <h3>Multijoueur</h3>
              </div>
              <ul class="patchnote-list">
                <li>
                  <span class="new-badge">NOUVEAU</span> Jouer contre un bot : si aucun joueur n'est trouvé en 15 secondes, tu peux lancer une partie contre un bot
                </li>
                <li>
                  <span class="improve-badge">AMÉLIORATION</span> « Lancer une partie » sur l'accueil lance directement la recherche d'adversaire
                </li>
                <li>
                  <span class="improve-badge">AMÉLIORATION</span> Choix du deck refait : un seul deck, un clic pour ajouter ou retirer une carte, sauvegarde automatique et bouton « Vider le deck »
                </li>
                <li>
                  <span class="improve-badge">AMÉLIORATION</span> Le coffre gagné en fin de match affiche son vrai nom et son icône
                </li>
                <li>
                  <span class="fix-badge">FIX</span> Le deck joué n'était pas toujours celui que tu avais choisi (cartes fantômes, deck aléatoire)
                </li>
                <li>
                  <span class="fix-badge">FIX</span> « Utiliser mon deck » prenait moins de cartes que prévu, et « Réinitialiser » remettait l'ancien deck
                </li>
                <li>
                  <span class="fix-badge">FIX</span> Les 10 cartes de saison de départ sont bien redonnées, même sur un nouveau compte ou après un rebirth
                </li>
              </ul>
            </div>

            <div class="patchnote-section">
              <div class="patchnote-section-header">
                <i data-lucide="castle"></i>
                <h3>Villaggio : Saison 2</h3>
              </div>
              <ul class="patchnote-list">
                <li>
                  <span class="new-badge">NOUVEAU</span> Le Palazzo n'a plus de niveau max, et arrivent les potions, de nouvelles troupes, défenses, ligues, décorations et niveaux de campagne
                </li>
                <li>
                  <span class="improve-badge">AMÉLIORATION</span> L'île passe de 24×24 à 28×28 cases, ton village est recentré automatiquement
                </li>
                <li>
                  <span class="improve-badge">AMÉLIORATION</span> Plus de mines, défenses, murs et décorations constructibles aux hauts niveaux
                </li>
                <li>
                  <span class="improve-badge">AMÉLIORATION</span> Les villages des bots ont maintenant un Palazzo à leur vrai niveau (ils avaient un niveau de trop)
                </li>
              </ul>
            </div>

            <div class="patchnote-section">
              <div class="patchnote-section-header">
                <i data-lucide="package"></i>
                <h3>Boutique</h3>
              </div>
              <ul class="patchnote-list">
                <li>
                  <span class="new-badge">NOUVEAU</span> Nouvelle ouverture de caisse : touche la caisse 3 fois pour l'ouvrir, avec une chance de Brainrot bonus
                </li>
                <li>
                  <span class="improve-badge">AMÉLIORATION</span> Code promo : une fenêtre animée te montre ce que tu as gagné (or, caisse ou Brainrot), et les erreurs s'affichent sous le champ au lieu d'une alerte
                </li>
                <li>
                  <span class="improve-badge">AMÉLIORATION</span> Les codes promo peuvent maintenant donner plusieurs caisses ou cartes d'un coup, et avoir une date de fin
                </li>
                <li>
                  <span class="fix-badge">FIX</span> Quand l'ouverture d'une caisse échoue, un message clair s'affiche et tes caisses t'attendent dans ton inventaire
                </li>
                <li>
                  <span class="fix-badge">FIX</span> Les prix ne se coupent plus sur deux lignes
                </li>
              </ul>
            </div>

            <div class="patchnote-section">
              <div class="patchnote-section-header">
                <i data-lucide="shopping-bag"></i>
                <h3>Marché des Brainrot</h3>
              </div>
              <ul class="patchnote-list">
                <li>
                  <span class="new-badge">NOUVEAU</span> Annonces du jour : 5 Brainrots mis en vente chaque jour à minuit par le Marchand du jour
                </li>
                <li>
                  <span class="fix-badge">FIX</span> Les cartes de saison ne peuvent plus être vendues au marché (elles sont redonnées gratuitement, ça permettait d'en farmer). Les annonces déjà en ligne reviennent à leur vendeur à expiration
                </li>
                <li>
                  <span class="fix-badge">FIX</span> Taille de l'icône ⚡ des annonces
                </li>
              </ul>
            </div>

            <div class="patchnote-section">
              <div class="patchnote-section-header">
                <i data-lucide="award"></i>
                <h3>Succès</h3>
              </div>
              <ul class="patchnote-list">
                <li>
                  <span class="new-badge">NOUVEAU</span> Les succès sont enfin là : 40 succès à débloquer, chacun avec sa récompense
                </li>
                <li>
                  <span class="improve-badge">AMÉLIORATION</span> La progression est vérifiée par le serveur et tes succès débloqués restent acquis, même après un rebirth
                </li>
                <li>
                  <span class="fix-badge">FIX</span> Le succès « Premier pote » prend bien en compte tes amis PlayWeb
                </li>
              </ul>
            </div>

            <div class="patchnote-section">
              <div class="patchnote-section-header">
                <i data-lucide="medal"></i>
                <h3>Classement</h3>
              </div>
              <ul class="patchnote-list">
                <li>
                  <span class="new-badge">NOUVEAU</span> 3 nouveaux classements : Victoires Villaggio, Succès et Série de connexion
                </li>
                <li>
                  <span class="improve-badge">AMÉLIORATION</span> Le classement se charge plus vite
                </li>
              </ul>
            </div>

            <div class="patchnote-section">
              <div class="patchnote-section-header">
                <i data-lucide="house"></i>
                <h3>Accueil &amp; interface</h3>
              </div>
              <ul class="patchnote-list">
                <li>
                  <span class="new-badge">NOUVEAU</span> Un tuto pour les nouveaux joueurs à leur première connexion
                </li>
                <li>
                  <span class="improve-badge">AMÉLIORATION</span> Accueil refait : chaque mode a sa carte avec une description, et des barres de progression pour tes Brainrots et tes succès
                </li>
                <li>
                  <span class="improve-badge">AMÉLIORATION</span> Le bonus de rebirth s'affiche sous tes pièces / sec
                </li>
                <li>
                  <span class="improve-badge">AMÉLIORATION</span> La page où tu es est surlignée dans la barre de navigation
                </li>
                <li>
                  <span class="improve-badge">AMÉLIORATION</span> La pastille du Villaggio passe en alerte quand tu t'es fait attaquer
                </li>
                <li>
                  <span class="improve-badge">AMÉLIORATION</span> Retrait de l'animation de présentation de la V3
                </li>
                <li>
                  <span class="fix-badge">FIX</span> « Brainrot acquis » affiche le vrai nombre de Brainrots du jeu (avant c'était toujours « / 200 »)
                </li>
                <li>
                  <span class="fix-badge">FIX</span> Le compteur de succès de l'accueil restait à 0
                </li>
                <li>
                  <span class="fix-badge">FIX</span> Le bouton Profil apparaissait en double
                </li>
              </ul>
            </div>

            <div class="patchnote-section">
              <div class="patchnote-section-header">
                <i data-lucide="wrench"></i>
                <h3>Général</h3>
              </div>
              <ul class="patchnote-list">
                <li>
                  <span class="improve-badge">AMÉLIORATION</span> Amélioration du système de modération
                </li>
                <li>
                  <span class="improve-badge">AMÉLIORATION</span> Amélioration technique pour un jeu plus fluide
                </li>
                <li>
                  <span class="improve-badge">AMÉLIORATION</span> Amélioration de l'anti-cheat
                </li>
                <li>
                  <span class="fix-badge">FIX</span> Fix de plein de bugs
                </li>
              </ul>
            </div>
          </div>
        </section>

        <section class="updates-card">
          <div class="updates-card-header">
            <i data-lucide="sparkles"></i>
            <h2>PlayWeb</h2>
            <span class="version-badge">V1.1.0</span><span class="version-date">02/11/2026</span>
          </div>
          <div class="patchnote-content">
            <div class="patchnote-section">
              <div class="patchnote-section-header">
                <i data-lucide="plus-circle"></i>
                <h3>Nouveautés</h3>
              </div>
              <ul class="patchnote-list">
                <li>
                  <span class="new-badge">NOUVEAU</span> Nouveau classement BrainrotStar : les mêmes colonnes et les mêmes tris que dans le jeu (Villaggio, succès, série de connexion...)
                </li>
                <li>
                  <span class="new-badge">NOUVEAU</span> Pseudos bannis : si ton pseudo est banni, tu dois en choisir un nouveau pour continuer
                </li>
                <li>
                  <span class="new-badge">NOUVEAU</span> Les anciens patchnotes sont réduits, un bouton permet de les afficher
                </li>
              </ul>
            </div>
            <div class="patchnote-section">
              <div class="patchnote-section-header">
                <i data-lucide="trending-up"></i>
                <h3>Améliorations</h3>
              </div>
              <ul class="patchnote-list">
                <li>
                  <span class="improve-badge">AMÉLIORATION</span> Ta place au classement BrainrotStar s'affiche dans « Votre profil »
                </li>
                <li>
                  <span class="improve-badge">AMÉLIORATION</span> Messages d'erreur plus clairs à la création de compte
                </li>
              </ul>
            </div>
            <div class="patchnote-section">
              <div class="patchnote-section-header">
                <i data-lucide="wrench"></i>
                <h3>Corrections</h3>
              </div>
              <ul class="patchnote-list">
                <li>
                  <span class="fix-badge">FIX</span> Correction de plusieurs failles de sécurité (amis, demandes d'ami, classement, profil)
                </li>
                <li>
                  <span class="fix-badge">FIX</span> Les caractères &lt; et &gt; sont interdits dans les pseudos
                </li>
                <li>
                  <span class="fix-badge">FIX</span> Ton pseudo s'affiche bien dans le menu de la page Leaderboard
                </li>
              </ul>
            </div>
          </div>
        </section>

        <section class="updates-card">
          <div class="updates-card-header">
            <i data-lucide="sparkles"></i>
            <h2>BrainrotStar</h2>
            <span class="version-badge">V3.0.2</span><span class="version-date">04/10/2026</span>
          </div>
          <div class="patchnote-content">
            <div class="patchnote-section">
              <div class="patchnote-section-header">
                <i data-lucide="trending-up"></i>
                <h3>Améliorations</h3>
              </div>
              <ul class="patchnote-list">
                <li>
                  <span class="improve-badge">AMÉLIORATION</span> Mis en place d'un anti-cheat
                </li>
              </ul>
            </div>
            <div class="patchnote-section">
              <div class="patchnote-section-header">
                <i data-lucide="wrench"></i>
                <h3>Corrections</h3>
              </div>

                <li>
                  <span class="fix-badge">BAN</span> Ban de certain joueurs qui avaient une macro
                </li>
              </ul>
            </div>
          </div>
        </section>

        <section class="updates-card">
          <div class="updates-card-header">
            <i data-lucide="sparkles"></i>
            <h2>PlayWeb</h2>
            <span class="version-badge">V1.0.1</span><span class="version-date">02/10/2026</span>
          </div>
          <div class="patchnote-content">
            <div class="patchnote-section">
              <div class="patchnote-section-header">
                <i data-lucide="trending-up"></i>
                <h3>Améliorations</h3>
              </div>
              <ul class="patchnote-list">
                <li>
                  <span class="improve-badge">AMÉLIORATION</span> Le menu de connexion / création de compte a été revu
                </li>
                <li>
                  <span class="improve-badge">AMÉLIORATION</span> Le classement BrainrotStar affiche maintenant le nombre de rebirths de chaque joueur
                </li>
              </ul>
            </div>
            <div class="patchnote-section">
              <div class="patchnote-section-header">
                <i data-lucide="wrench"></i>
                <h3>Corrections</h3>
              </div>
              <ul class="patchnote-list">
                <li>
                  <span class="fix-badge">FIX</span> Le classement BrainrotStar s'affiche enfin sur PlayWeb, même pour les joueurs qui n'ont pas encore de compte BrainrotStar
                </li>
              </ul>
            </div>
          </div>
        </section>

        <section class="updates-card">
          <div class="updates-card-header">
            <i data-lucide="sparkles"></i>
            <h2>BrainrotStar</h2>
            <span class="version-badge">V3.0.1</span><span class="version-date">02/10/2026</span>
          </div>
          <div class="patchnote-content">
            <div class="patchnote-section">
              <div class="patchnote-section-header">
                <i data-lucide="trending-up"></i>
                <h3>Améliorations</h3>
              </div>
              <ul class="patchnote-list">
                <li>
                  <span class="improve-badge">AMÉLIORATION</span> Le classement prend maintenant en compte le nombre de rebirths : faire un rebirth ne te fait plus chuter dans le classement
                </li>
                <li>
                  <span class="improve-badge">AMÉLIORATION</span> Dans le classement des rebirths, les égalités sont départagées par les pièces / sec
                </li>
                <li>
                  <span class="improve-badge">AMÉLIORATION</span> La page Succès affiche « Succès à venir » au lieu d'une page vide
                </li>
                <li>
                  <span class="improve-badge">AMÉLIORATION</span> Retrait des badges « Nouveau » sur l'accueil
                </li>
              </ul>
            </div>
            <div class="patchnote-section">
              <div class="patchnote-section-header">
                <i data-lucide="wrench"></i>
                <h3>Corrections</h3>
              </div>
              <ul class="patchnote-list">
                <li>
                  <span class="fix-badge">FIX</span> Un changement de pseudo sur PlayWeb est maintenant repris dans BrainrotStar (à la prochaine ouverture du jeu)
                </li>
              </ul>
            </div>
          </div>
        </section>

              <div class="patchnote-section-header">

                <h3>Nouveautés</h3>
              </div>

                <li>
                  <span class="new-badge">NOUVEAU</span> Support de BrainrotStar

                <li>
                  <span class="new-badge">NOUVEAU</span> Partage de profil

                <li>

                </li>
                <li>
                  <span class="new-badge">NOUVEAU</span> Succès de tous les jeux du studio

                <li>

                </li>

          </div>

        <section class="updates-card">
          <div class="updates-card-header">
            <i data-lucide="sparkles"></i>
            <h2>BrainrotStar</h2>
            <span class="version-badge">V3</span><span class="version-date">27/09/2026</span>

              <ul class="patchnote-list">
                <li>
                  <span class="new-badge">NOUVEAU</span> Ajout de BrainrotStar sur PlayWeb

                </li>

            <div class="patchnote-section">
              <div class="patchnote-section-header">
                <i data-lucide="wrench"></i>

              <ul class="patchnote-list">
